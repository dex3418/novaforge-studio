name: studio

# Renders carousel PNGs (zip), a 9:16 Reel and a 16:9 YouTube video from a script.
# Triggers:
#   - the "box" page on your phone (workflow_dispatch with script_text)
#   - manual run from the Actions tab
#   - a push that touches studio/scripts/**

run-name: studio - ${{ github.event.inputs.script_name || github.event.head_commit.message || 'run' }}

on:
  push:
    paths:
      - 'studio/scripts/**'
  workflow_dispatch:
    inputs:
      script_text:
        description: 'Full script text (used by the box page)'
        required: false
        default: ''
      script_name:
        description: 'Short name for the output files'
        required: false
        default: ''
      script:
        description: 'Or a script path relative to studio/ (blank = all scripts)'
        required: false
        default: ''
      only:
        description: 'What to build: carousel,reel,long (blank = all)'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Fonts, zip and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji zip ffmpeg

      - name: Browser libraries for Remotion
        continue-on-error: true
        run: |
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install studio dependencies
        working-directory: studio
        run: npm install --no-audit --no-fund

      - name: Pick scripts
        id: pick
        working-directory: studio
        env:
          SCRIPT_TEXT: ${{ github.event.inputs.script_text }}
          SCRIPT_NAME: ${{ github.event.inputs.script_name }}
          SCRIPT_INPUT: ${{ github.event.inputs.script }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          files=""
          if [ -n "$SCRIPT_TEXT" ]; then
            name=$(printf '%s' "$SCRIPT_NAME" | tr 'A-Z' 'a-z' | tr -cs 'a-z0-9' '-' | sed 's/^-*//; s/-*$//' | cut -c1-40)
            if [ -z "$name" ]; then name="post-$(date +%s)"; fi
            mkdir -p scripts/_inbox
            printf '%s\n' "$SCRIPT_TEXT" > "scripts/_inbox/$name.md"
            files="scripts/_inbox/$name.md"
          elif [ -n "$SCRIPT_INPUT" ]; then
            files="$SCRIPT_INPUT"
          elif [ "$EVENT" = "push" ]; then
            files=$(git diff --name-only --diff-filter=AM --relative HEAD~1 HEAD -- scripts | grep '\.md$' | tr '\n' ' ' || true)
            if [ -z "$files" ]; then skip=true; fi
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Scripts: ${files:-all}  skip=$skip"

      - name: Render
        if: steps.pick.outputs.skip != 'true'
        working-directory: studio
        env:
          FILES: ${{ steps.pick.outputs.files }}
          ONLY: ${{ github.event.inputs.only }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          if [ -n "$ONLY" ]; then
            node src/build.js $FILES --only "$ONLY"
          else
            node src/build.js $FILES
          fi

      - name: Upload results
        if: steps.pick.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: studio-output
          path: |
            studio/out/**/*.mp4
            studio/out/**/*.zip
            studio/out/**/*.txt
            studio/out/**/*.json
            studio/out/**/*.md
          retention-days: 14
